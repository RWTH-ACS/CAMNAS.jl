name: Run tests

on:
  push:
    branches:
      - master
      - main
  pull_request:

# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

jobs:
  julia-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12.1']
        julia-arch: [x64]

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        # with:
        #   annotate: true

  docker-build:
    timeout-minutes: 40
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t camnas .

      - name: Save image
        run: docker save camnas | gzip > image.tar.gz

      # Save as artifact
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz

  shared-library-docker:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - run: |
          gunzip -c image.tar.gz | docker load

      - name: Build Plugin
        run: |
          docker run --rm \
              --name camnas \
              -v "$GITHUB_WORKSPACE:/app/dpsim/dpsim/src/SolverPlugins/CAMNAS.jl" \
              camnas \
              bash -lc '
                set -e

                julia --project=. -e "using Pkg; Pkg.instantiate()"

                make -j8
              '

      - name: Run solver Plugin
        run: |
          docker run --rm \
              -v "$GITHUB_WORKSPACE:/app/dpsim/dpsim/src/SolverPlugins/CAMNAS.jl" \
              -e JL_MNA_ALLOW_GPU=false \
              camnas \
              bash -lc '
                cd /app/dpsim/build/dpsim/examples/cxx
                export LD_LIBRARY_PATH=/app/dpsim/dpsim/src/SolverPlugins/CAMNAS.jl:/app/dpsim/dpsim/src/SolverPlugins/CAMNAS.jl/camnas/lib:$LD_LIBRARY_PATH
                exec ./WSCC_9bus_mult_coupled -U Plugin -P camnasjl
              '